---
---
- name: Create user fhin
  hosts: all
  become: false

  tasks:
    - name: Create user fhin
      ansible.builtin.user:
        name: fhin
        shell: /bin/bash
        create_home: true
        state: present

- name: Verify user fhin
  hosts: all
  become: false

  tasks:
    - name: Check user
      ansible.builtin.command: id fhin
      register: user_info

    - name: Display user info
      ansible.builtin.debug:
        var: user_info.stdout